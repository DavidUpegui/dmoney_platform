# Local development stack for dmoney: Postgres + the Spring Boot back-end.
# The front-end runs separately through Expo; use `./dev` for the full flow.
#
# The back-end container runs a prebuilt jar. `./dev` builds it when the
# back-end sources are newer than the jar and restarts the container.
#
# Host ports are published by docker-compose.override.yml so this stack can
# coexist with other local projects that already own 5432/8080.
name: dmoney-dev

services:
  db:
    image: postgres:16
    container_name: dmoney-dev-db
    environment:
      POSTGRES_DB: dmoney
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - dmoney-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dmoney"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: eclipse-temurin:21-jre
    container_name: dmoney-dev-back
    depends_on:
      db:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-secret-do-not-use-in-prod-0123456789}
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/dmoney
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root
      JAVA_TOOL_OPTIONS: -Xmx640m
    volumes:
      - ../../../dmoney_back/build/libs/dmoney-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    command: ["java", "-jar", "/app/app.jar", "--server.port=8080"]
    ports:
      - "8080:8080"

volumes:
  dmoney-pgdata:
    name: dmoney-pgdata
