name: Contract Sync

# Receives a push-triggered dispatch from dmoney_back when a change lands on
# trunk, regenerates the OpenAPI spec from that exact commit by booting the
# back-end, and opens a PR updating contracts/openapi.json in this repo.
#
# Triggered by dmoney_back via peter-evans/repository-dispatch:
#   event-type: openapi-updated
#   client-payload: { "ref": "<sha>" }

on:
  repository_dispatch:
    types: [openapi-updated]
  workflow_dispatch:
    inputs:
      ref:
        description: dmoney_back ref (branch/tag/sha) to generate the contract from
        required: true
        default: trunk

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dmoney
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BACK_REF: ${{ github.event.client_payload.ref || github.event.inputs.ref }}
      JWT_SECRET: ci-only-not-a-real-secret
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/dmoney
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root
    steps:
      - name: Checkout platform
        uses: actions/checkout@v4

      - name: Checkout dmoney_back at ${{ env.BACK_REF }}
        uses: actions/checkout@v4
        with:
          repository: DavidUpegui/dmoney_back
          ref: ${{ env.BACK_REF }}
          path: back
          token: ${{ secrets.CONTRACT_SYNC_TOKEN }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Start back-end
        working-directory: back
        run: |
          chmod +x gradlew
          nohup ./gradlew bootRun --no-daemon > /tmp/back.log 2>&1 &

      - name: Export OpenAPI spec
        run: |
          echo "Waiting for /v3/api-docs ..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/v3/api-docs -o contracts/openapi.json; then
              echo "Fetched OpenAPI spec."
              break
            fi
            sleep 5
          done
          test -s contracts/openapi.json

      - name: Back-end log (on failure)
        if: failure()
        run: tail -n 200 /tmp/back.log || true

      - name: Open sync PR
        # Must use a PAT, not GITHUB_TOKEN: PRs opened with GITHUB_TOKEN do not
        # trigger other workflows, so the contract-gate check would be skipped.
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PLATFORM_PR_TOKEN }}
          branch: contract/sync
          delete-branch: true
          commit-message: "contract: sync openapi.json from dmoney_back@${{ env.BACK_REF }}"
          title: "contract: sync OpenAPI from dmoney_back"
          body: |
            Automated contract sync.

            - Source: `dmoney_back@${{ env.BACK_REF }}`
            - Generated by: `.github/workflows/contract-sync.yml`

            The `contract-gate` workflow checks this PR for breaking changes.
