name: Contract Sync

# Receives a push-triggered dispatch from dmoney_back when a change lands on
# trunk, regenerates the OpenAPI spec from that exact commit, and opens a PR
# updating contracts/openapi.json in this repo.
#
# Generation runs dmoney_back's OpenApiExportTest, which boots the Spring
# context against in-memory H2 (no web server, no Postgres) and writes the
# spec. No application server or database is started.
#
# Triggered by dmoney_back via peter-evans/repository-dispatch:
#   event-type: openapi-updated
#   client-payload: { "ref": "<sha>" }

on:
  repository_dispatch:
    types: [openapi-updated]
  workflow_dispatch:
    inputs:
      ref:
        description: dmoney_back ref (branch/tag/sha) to generate the contract from
        required: true
        default: trunk

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      BACK_REF: ${{ github.event.client_payload.ref || github.event.inputs.ref }}
    steps:
      - name: Checkout platform
        uses: actions/checkout@v4

      - name: Checkout dmoney_back at ${{ env.BACK_REF }}
        uses: actions/checkout@v4
        with:
          repository: DavidUpegui/dmoney_back
          ref: ${{ env.BACK_REF }}
          path: back
          token: ${{ secrets.CONTRACT_SYNC_TOKEN }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Export OpenAPI spec (H2, no server)
        working-directory: back
        run: |
          chmod +x gradlew
          ./gradlew cleanTest test \
            --tests "com.dmoney.dmoney.OpenApiExportTest" \
            -Dopenapi.export=true \
            --no-daemon

      - name: Publish contract
        run: |
          test -s back/build/openapi/openapi.json
          cp back/build/openapi/openapi.json contracts/openapi.json

      - name: Open sync PR
        # Must use a PAT, not GITHUB_TOKEN: PRs opened with GITHUB_TOKEN do not
        # trigger other workflows, so the contract-gate check would be skipped.
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PLATFORM_PR_TOKEN }}
          branch: contract/sync
          delete-branch: true
          commit-message: "contract: sync openapi.json from dmoney_back@${{ env.BACK_REF }}"
          title: "contract: sync OpenAPI from dmoney_back"
          body: |
            Automated contract sync.

            - Source: `dmoney_back@${{ env.BACK_REF }}`
            - Generated by: `.github/workflows/contract-sync.yml` (H2 spec export, no server/database)

            The `contract-gate` workflow checks this PR for breaking changes.
